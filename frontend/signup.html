<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign Up — Rolyn</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="header-logo" href="index.html" aria-label="Rolyn home">
          <img src="../media/rolyn-logo.png" alt="Rolyn" />
        </a>
        <form class="header-search" role="search">
          <input type="search" name="q" placeholder="Search jobs, services..." aria-label="Search" />
        </form>
        <nav class="header-actions" aria-label="Account" id="header-actions">
          
        </nav>
      </div>
    </header>

    <main class="auth-page">
      <div class="auth-card sidebar-card">
        <h1 class="sidebar-heading">Create an account</h1>
        <p class="auth-lead">Join Rolyn to post jobs, offer services, and connect with your community.</p>
 
        <p id="auth-error" class="auth-error" role="alert" hidden></p>
        <p id="auth-success" class="form-success" role="status" hidden></p>
 
        <form id="signup-form" class="auth-form" novalidate>
          <!-- Full name -->
          <div class="auth-field">
            <label class="filter-label" for="full-name">Full name</label>
            <input
              class="auth-input"
              type="text"
              id="full-name"
              name="full-name"
              autocomplete="name"
              placeholder="Juan dela Cruz"
              required
            />
          </div>

          <!-- Location -->
          <div class="auth-field">
            <label class="filter-label" for="location">Location</label>
            <select class="auth-input filter-select" id="location" name="location" required>
              <option value="">Select your city…</option>
              <option value="Manila">Manila</option>
              <option value="Metro Manila (NCR)">Metro Manila (NCR)</option>
              <option value="Cebu">Cebu</option>
              <option value="Davao">Davao</option>
              <option value="Palo Alto">Palo Alto</option>
            </select>
          </div>

          <!-- Phone number -->
          <div class="auth-field">
            <label class="filter-label" for="phone">Phone number <span class="auth-field-optional">(optional)</span></label>
            <input
              class="auth-input"
              type="tel"
              id="phone"
              name="phone"
              autocomplete="tel"
              placeholder="+63 912 345 6789"
            />
          </div>
          
          <!-- Email -->
          <div class="auth-field">
            <label class="filter-label" for="email">Email</label>
            <input
              class="auth-input"
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              required
            />
          </div>
 
          <!-- Password -->
          <div class="auth-field">
            <label class="filter-label" for="password">Password</label>
            <input
              class="auth-input"
              type="password"
              id="password"
              name="password"
              autocomplete="new-password"
              required
            />
            <!-- Strength indicator -->
            <div class="strength-bar-track" aria-hidden="true">
              <span class="strength-segment" id="seg1"></span>
              <span class="strength-segment" id="seg2"></span>
              <span class="strength-segment" id="seg3"></span>
              <span class="strength-segment" id="seg4"></span>
            </div>
            <p class="strength-label" id="strength-label" aria-live="polite"></p>
          </div>
 
          <!-- Confirm password -->
          <div class="auth-field">
            <label class="filter-label" for="confirm-password">Confirm password</label>
            <div class="input-wrapper">
              <input
                class="auth-input"
                type="password"
                id="confirm-password"
                name="confirm-password"
                autocomplete="new-password"
                required
              />
              <span class="match-icon" id="match-icon" aria-hidden="true"></span>
            </div>
          </div>

          <p class="auth-footer">By clicking Create Account, you agree to Rolyn's <a href="guidelines.html">Community Guidelines</a></p>
 
          <button type="submit" class="btn btn-primary btn-block">Create account</button>
        </form>
 
        <div class="auth-divider" aria-hidden="true">or</div>
 
        <button type="button" id="google-signup" class="btn btn-ghost btn-block btn-google">
          <!-- Google "G" logo -->
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615Z" fill="#4285F4"/>
            <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z" fill="#34A853"/>
            <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332Z" fill="#FBBC05"/>
            <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58Z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>
 
        <p class="auth-footer">
          Already have an account?
          <a href="login.html">Log in</a>
        </p>
      </div>
    </main>
    <script type="module" src="./js/signup.js"></script>
    <script type="module" src="./js/header.js"></script>
  </body>
</html>
