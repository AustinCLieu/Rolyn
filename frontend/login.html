<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log In — Rolyn</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="header-logo" href="index.html" aria-label="Rolyn home">
          <img src="../media/rolyn-logo.png" alt="Rolyn" />
        </a>
        <form class="header-search" role="search">
          <input type="search" name="q" placeholder="Search jobs, services..." aria-label="Search" />
        </form>
        <nav class="header-actions" aria-label="Account">
          <a href="login.html" class="btn btn-ghost">Login</a>
          <a href="signup.html" class="btn btn-ghost">Sign Up</a>
          <a href="create.html" class="btn btn-primary">Post</a>
        </nav>
      </div>
    </header>

    <main class="auth-page">
      <div class="auth-card sidebar-card">
        <h1 class="sidebar-heading">Log in</h1>
        <p class="auth-lead">Welcome back. Sign in to post jobs and message sellers.</p>

        <p id="auth-error" class="auth-error" role="alert" hidden></p>

        <form id="login-form" class="auth-form">
          <div class="auth-field">
            <label class="filter-label" for="email">Email</label>
            <input
              class="auth-input"
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              required
            />
          </div>
          <div class="auth-field">
            <label class="filter-label" for="password">Password</label>
            <input
              class="auth-input"
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              required
            />
          </div>
          <button type="submit" class="btn btn-primary btn-block">Log in</button>
        </form>

        <div class="auth-divider" aria-hidden="true">or</div>

        <button type="button" id="google-login" class="btn btn-ghost btn-block">
          Continue with Google
        </button>

        <p class="auth-footer">
          Don&apos;t have an account?
          <a href="signup.html">Sign up</a>
        </p>
      </div>
    </main>

    <script type="module">
      import { signInWithEmail, signInWithGoogle } from "./js/auth.js";

      const form = document.getElementById("login-form");
      const errorEl = document.getElementById("auth-error");

      function showError(message) {
        errorEl.textContent = message;
        errorEl.hidden = !message;
      }

      form?.addEventListener("submit", async (event) => {
        event.preventDefault();
        showError("");

        const email = form.email.value.trim();
        const password = form.password.value;

        const { error } = await signInWithEmail(email, password);
        if (error) {
          showError(error.message);
          return;
        }

        window.location.href = "index.html";
      });

      document.getElementById("google-login")?.addEventListener("click", () => {
        signInWithGoogle();
      });
    </script>
  </body>
</html>
